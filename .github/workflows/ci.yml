name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Run tests
        run: uv run --no-sync python -m pytest -m "not slow and not integration" tests/platform tests/db tests/vector_db tests/server tests/llm tests/ingest tests/test_rate_limiter.py tests/test_cache_provider.py tests/test_security_auth.py tests/test_api_key_store.py tests/test_quota_store.py tests/test_query_processor.py tests/test_generator.py tests/test_validation.py tests/test_query_filters.py tests/test_rag_chain_budget.py tests/test_rag_chain_integration.py tests/test_api_schemas.py tests/test_mcp_adapter.py tests/test_api_error_envelope.py
      - name: Run tests (extended suites)
        # Separate invocation: these suites stub heavy modules (numpy/PIL/docling/
        # langchain) at collection time, which pollutes sys.modules for the
        # ingest/vision tests if merged into the primary command. A separate
        # process keeps them isolated. See TEST_COVERAGE_PLAN.md (CI-gating slice).
        run: uv run --no-sync python -m pytest -m "not slow and not integration" tests/retrieval tests/guardrails tests/core tests/contracts tests/observability
      - name: Eval loop offline smoke
        run: uv run --no-sync python -m src.eval.smoke
      - name: Build console TypeScript UI
        run: npm --prefix server/console/web ci && npm --prefix server/console/web run check && npm --prefix server/console/web run build && npm --prefix server/console/web test
      - name: Compile checks
        run: uv run --no-sync python -m py_compile server/api.py server/activities.py src/retrieval/pipeline/rag_chain.py

